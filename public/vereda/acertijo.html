<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A3A22">
<base href="../">
<title>El acertijo del mayordomo · La Vereda</title>
<link rel="stylesheet" href="vereda/vereda.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%234A6338'/%3E%3Cellipse cx='24' cy='24' rx='11' ry='15' fill='%23F4EFE2'/%3E%3Cpath d='M24 11c-3 4.5-3 21.5 0 26' fill='none' stroke='%234A6338' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
.dia{display:flex;gap:14px;align-items:center;border:2px solid var(--oro);border-radius:20px;padding:14px;
  background:linear-gradient(rgba(58,78,40,.9),rgba(24,38,18,.9));margin:6px 0 14px}
.dia .med{width:84px;height:84px;flex:none;border-radius:50%;background:var(--papel);display:grid;place-items:center;
  box-shadow:inset 0 0 0 6px #3F6B4A,inset 0 0 0 9px #fff,0 8px 16px rgba(0,0,0,.35)}
.dia .med img,.dia .med svg{width:68%;height:68%;object-fit:contain}
.dia .txt{flex:1;min-width:0}
.dia h3{margin:0 0 2px;font-size:20px;font-weight:600}
.dia p{margin:0 0 8px;font-size:14.5px}
.meta{display:flex;gap:10px;align-items:center;font-size:17px;line-height:1.3}
.meta .ico{width:46px;height:46px;flex:none}
.meta .ico img,.meta .ico svg{width:100%;height:100%;object-fit:contain}
.vecino{margin-top:12px;background:rgba(0,0,0,.2);border-radius:16px;padding:10px}
.vecino .quien{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:16px}
.vecino .quien .av{width:30px;height:30px;flex:none}
.vecino .quien .av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.badge{font-size:12.5px;padding:2px 9px;border-radius:12px;background:#D97A16;color:#fff;animation:late 1.4s ease-in-out infinite}
.badge.ok{background:#3D7224;animation:none}
@keyframes late{50%{box-shadow:0 0 0 3px rgba(217,122,22,.4)}}
.vecino .finca .mata{width:66px}
.vecino .finca .mata .disco{width:54px;height:54px}
.tuya{margin-top:14px}
.tuya .cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tuya .cab h3{margin:0;font-size:19px;font-weight:600}
.cuenta{font-size:15px;padding:3px 12px;border-radius:14px;background:rgba(0,0,0,.3)}
.cuenta.ok{background:#3D7224}
.maldito{font-size:14.5px;line-height:1.35;background:rgba(107,79,168,.35);border:1px solid #9B7FE0;border-radius:12px;padding:8px 10px;margin-bottom:10px}
.jornales{display:flex;align-items:center;gap:8px;justify-content:center;margin:16px 0 10px;font-size:16px}
.jornales i{width:22px;height:22px;border-radius:6px;background:var(--oro);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.jornales i.gastado{background:rgba(255,255,255,.14);box-shadow:none}
.mano{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 0 4px}
@media (max-width:440px){.mano .cartica{width:84px;padding:5px 4px 7px}.mano .cartica .ilu{width:60px;height:60px}
  .mano .cartica .n{font-size:13px}.mano .cartica .cl{font-size:9.5px}}
.opciones{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opciones:empty{display:none}
.op{border:1.5px solid var(--oro);border-radius:14px;background:rgba(224,176,74,.14);color:var(--crema);font-size:16px;padding:11px 14px;text-align:left}
.op:active{transform:scale(.99)}
.op.dano{border-color:#E26A55;background:rgba(142,42,32,.3)}
.herr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.herr .boton{padding:10px 6px;font-size:15px}
.diario{font-size:14.5px;color:var(--tenue);text-align:center;min-height:1.4em;margin-top:10px}
.fallo{margin-top:12px;border:1.5px solid #E26A55;background:rgba(142,42,32,.35);border-radius:14px;padding:10px 12px;text-align:center;font-size:16px}
.cargando{text-align:center;padding:40px 0;font-size:18px;color:var(--tenue)}
/* Acostado: las fincas a la izquierda; jornales, mano y opciones a la derecha */
@media (orientation:landscape) and (max-height:500px){
  .v-lienzo:has(.tuya-juego){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);
    grid-template-rows:minmax(0,auto) minmax(0,1fr);grid-template-areas:"vec jue" "fin jue";gap:8px 12px;overflow:hidden}
  .v-lienzo:has(.tuya-juego) > .marco:first-child{grid-area:vec;margin:0;min-height:0;overflow:auto;padding:8px 10px}
  .v-lienzo:has(.tuya-juego) .tuya{display:contents}
  .tuya-finca,.tuya-juego{background:var(--panel);border:1.5px solid var(--oro);border-radius:14px;padding:8px 10px;min-height:0}
  .tuya-finca{grid-area:fin;overflow:auto}
  .tuya-juego{grid-area:jue;display:flex;flex-direction:column;gap:5px;overflow:hidden}
  .meta{font-size:13.5px;gap:8px}
  .meta .ico{width:32px;height:32px}
  .vecino{margin-top:6px;padding:5px 8px;border-radius:12px}
  .vecino .quien{margin-bottom:3px;font-size:13.5px}
  .vecino .quien .av{width:24px;height:24px}
  .v-lienzo:has(.tuya-juego) .finca{gap:6px}
  .v-lienzo:has(.tuya-juego) .finca .mata,.vecino .finca .mata{width:54px}
  .v-lienzo:has(.tuya-juego) .finca .mata .disco,.vecino .finca .mata .disco{width:44px;height:44px}
  .v-lienzo:has(.tuya-juego) .mata .est{font-size:10px;padding:1px 5px}
  .v-lienzo:has(.tuya-juego) .mata .enc span{width:18px;height:18px}
  .tuya .cab{margin-bottom:4px}
  .tuya .cab h3{font-size:15px}
  .cuenta{font-size:12.5px;padding:2px 9px}
  .maldito{font-size:12px;padding:4px 8px;margin-bottom:4px}
  .jornales{margin:0;font-size:13.5px}
  .jornales i{width:16px;height:16px}
  .mano{padding:4px 0 0;gap:6px;flex:none;flex-wrap:nowrap}
  .mano .cartica{flex:0 1 78px;width:auto;min-width:0;padding:4px 3px 6px}
  .mano .cartica .ilu{width:min(50px,82%);height:auto;aspect-ratio:1}
  .mano .cartica .n{font-size:11.5px}
  .mano .cartica .cl{font-size:9px}
  .opciones{margin:0;flex:1;min-height:0;overflow:auto;gap:5px}
  .op{font-size:13.5px;padding:6px 10px;border-radius:11px}
  .fallo{margin:0;font-size:13px;padding:5px 8px}
  .diario{margin:0;font-size:12.5px;min-height:0}
  .herr{margin:0;gap:6px;grid-template-columns:auto minmax(0,1fr) auto}
  .herr .boton{padding:6px 4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
</style>
<script src="girar.js"></script>
<script src="supabase-config.js"></script>
<script src="cuenta.js"></script>
</head>
<body>
<main class="v-lienzo" id="app"></main>
<script src="reglas.js"></script>
<script src="arte.js"></script>
<script src="sonido.js"></script>
<script src="vereda/nucleo.js"></script>
<script src="vereda/acertijos.js"></script>
<script src="vereda/acertijo.js"></script>
</body>
</html>
