<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A3A22">
<base href="../">
<title>El espantapájaros · La Vereda</title>
<link rel="stylesheet" href="vereda/vereda.css">
<style>
.reglas-esp{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.reglas-esp li{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.3}
.reglas-esp b,.amigos b{color:#F3D27A;font-weight:600}
.reglas-esp .p,.amigos .p{width:44px;height:44px;flex:none;display:grid;place-items:center}
.reglas-esp .p img,.reglas-esp .p svg,.amigos .p img,.amigos .p svg{width:100%;height:100%;object-fit:contain}
.amigos{display:flex;align-items:center;gap:10px;background:rgba(224,176,74,.12);border:1px solid rgba(224,176,74,.35);border-radius:12px;padding:8px 10px;margin:0;color:var(--crema)!important;font-size:14.5px!important}
.amigos .ps{display:flex;flex:none}
.amigos .ps .p{width:36px;height:36px;margin-right:-6px}

.campo{position:relative;width:100%;aspect-ratio:4/3.2;border-radius:20px;overflow:hidden;border:1.5px solid var(--oro);
  background:radial-gradient(70% 40% at 50% 78%,#6B4A2A 0 55%,transparent 56%),
    radial-gradient(120% 90% at 50% 25%,#7FA35A 0%,#5C8540 55%,#3F6330 100%);box-shadow:var(--sombra);
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.campo::before{content:"";position:absolute;left:12%;right:12%;top:58%;height:30%;border-radius:50%;
  background:repeating-linear-gradient(90deg,rgba(60,38,20,.25) 0 6px,transparent 6px 22px);pointer-events:none}
.espanta{position:absolute;left:50%;top:14%;width:20%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));animation:mece 3.2s ease-in-out infinite}
.espanta img{width:100%;height:100%;object-fit:contain}
@keyframes mece{50%{transform:translate(-50%,-50%) rotate(3deg)}}
.mata-h{position:absolute;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 5px 5px rgba(0,0,0,.35))}
.mata-h img,.mata-h svg{width:100%;height:100%;object-fit:contain}
.mata-h.mordida{animation:mordida .5s ease}
@keyframes mordida{25%{transform:translate(-56%,-50%) rotate(-6deg);filter:drop-shadow(0 0 10px rgba(226,106,85,.9))}75%{transform:translate(-44%,-50%) rotate(6deg)}}
.animal{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;padding:0;background:none;z-index:3;touch-action:manipulation;cursor:pointer}
.animal.amigo{width:11%;z-index:4}
.animal .cuerpo{display:block;width:100%;height:100%;animation:paso .35s ease-in-out infinite alternate;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.animal.amigo .cuerpo{animation:vuelo .6s ease-in-out infinite alternate}
.animal.izq .cuerpo img,.animal.izq .cuerpo svg{transform:scaleX(-1)}
.animal .cuerpo img,.animal .cuerpo svg{width:100%;height:100%;object-fit:contain;display:block}
@keyframes paso{to{transform:translateY(-6%) rotate(3deg)}}
@keyframes vuelo{to{transform:translateY(-10%)}}
.animal.huye .cuerpo{animation:none;transform:scale(1.1)}
.animal.come{animation:come .45s ease forwards}
@keyframes come{to{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
.animal.asustado{animation:asustado .5s ease forwards}
@keyframes asustado{30%{transform:translate(-50%,-80%) scale(1.15)}to{opacity:0;transform:translate(-50%,-120%) scale(.8)}}
.porque-amigo{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:6;width:min(92%,420px);text-align:center;
  background:rgba(32,50,26,.92);border:1.5px solid #E0B04A;border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.3;color:#FFF6DC;
  box-shadow:0 8px 18px rgba(0,0,0,.4);animation:aparece .25s ease both;pointer-events:none}

/* Acostado: los contadores a un lado y la huerta, entera, en el centro */
@media (orientation:landscape) and (max-height:500px){
  .v-lienzo:has(#campo){display:grid;grid-template-columns:minmax(84px,.9fr) auto minmax(84px,.9fr);
    grid-template-rows:minmax(0,1fr);gap:12px;overflow:hidden;align-items:center}
  .v-lienzo:has(#campo) .hud{grid-column:1;grid-row:1;flex-direction:column;align-items:stretch;justify-content:center;margin:0;gap:8px}
  .v-lienzo:has(#campo) .reloj{grid-column:3;grid-row:1;width:14px;height:80%;justify-self:center;margin:0;display:flex;align-items:flex-end}
  .v-lienzo:has(#campo) .reloj i{transform-origin:bottom;height:100%;width:100%;transform:scaleY(var(--resta,1))!important}
  .campo{grid-column:2;grid-row:1;height:100%;width:auto;max-width:100%;justify-self:center}
  .porque-amigo{font-size:13px;padding:6px 10px}
  .reglas-esp{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:4px 0}
  .reglas-esp li{flex-direction:column;text-align:center;gap:2px;font-size:11.5px;padding:4px 4px;line-height:1.2}
  .reglas-esp .p{width:34px;height:34px}
  .amigos{font-size:12px!important;padding:6px 8px}
  .amigos .ps .p{width:28px;height:28px}
}
</style>
<script src="girar.js"></script>
<script src="supabase-config.js"></script>
<script src="cuenta.js"></script>
</head>
<body>
<main class="v-lienzo" id="app"></main>
<script src="reglas.js"></script>
<script src="arte.js"></script>
<script src="sonido.js"></script>
<script src="vereda/nucleo.js"></script>
<script src="vereda/espantapajaros.js"></script>
</body>
</html>
