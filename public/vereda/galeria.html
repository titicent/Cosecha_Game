<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A3A22">
<base href="../">
<title>La Galería · La Vereda</title>
<link rel="stylesheet" href="vereda/vereda.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%234A6338'/%3E%3Cellipse cx='24' cy='24' rx='11' ry='15' fill='%23F4EFE2'/%3E%3Cpath d='M24 11c-3 4.5-3 21.5 0 26' fill='none' stroke='%234A6338' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
.pasos{margin:8px 0 12px;padding-left:22px;color:var(--crema);font-size:15px;line-height:1.4}
.pasos li{margin-bottom:5px}
.pasos b{color:#F3D27A;font-weight:600}
.rot{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);margin:10px 0 6px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.dos{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.seg button{border:1.5px solid var(--oro-suave);background:rgba(0,0,0,.25);border-radius:12px;padding:8px 12px;font-size:15px;color:var(--crema)}
.seg button[aria-pressed=true]{background:rgba(224,176,74,.22);border-color:var(--oro)}
.campo{width:100%;background:rgba(6,14,5,.6);border:1.5px solid var(--oro-suave);border-radius:30px;padding:11px 16px;color:var(--crema);font-size:17px;font-family:inherit;margin-bottom:8px}
.campo.codigo{text-transform:uppercase;letter-spacing:.35em;text-align:center;max-width:170px;margin:0}
.boton.ancho{width:100%;margin-bottom:10px}
.boton.chico{font-size:15px;padding:7px 14px}
.boton.redondo{width:54px;height:54px;padding:0;font-size:28px;border-radius:50%}
.fila.centro{justify-content:center;margin:12px 0}
.clave{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.clave i{font-style:normal;width:56px;height:66px;display:grid;place-items:center;font-size:38px;background:var(--papel);color:var(--tinta);border-radius:12px;border:3px solid var(--oro)}
.gente-g{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.gente-g>div{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:12px;padding:6px 10px;text-align:left}
.gente-g>div>span{flex:1}
.gente-g small{display:block;font-size:12px;color:var(--tenue)}
.gente-g svg,.gente-g img{width:36px;height:36px;flex:none}
.tabla-g{background:var(--panel);border:1.5px solid var(--oro-suave);border-radius:16px;padding:8px}
.tabla-g>div{display:grid;grid-template-columns:34px minmax(0,1fr) auto 44px}
.tabla-g .nm{font-size:15px;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabla-g .nm small{white-space:normal}
@media (max-width:420px){.tabla-g>div{grid-template-columns:30px minmax(0,1fr) auto 38px;gap:6px;padding:6px}.cul{width:22px;height:22px}.of{width:36px;height:36px}}
.tabla-g .yo .nm{color:#F3D27A}
.tabla-g .gana{background:rgba(224,176,74,.22);box-shadow:inset 0 0 0 1.5px var(--oro)}
.bod{display:flex;gap:3px}
.cul{position:relative;width:26px;height:26px;border-radius:50%;background:var(--papel);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--t)}
.cul img,.cul svg{width:78%;height:78%;object-fit:contain}
.cul b{position:absolute;right:-5px;bottom:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--t);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 3px}
.cul.vacio{opacity:.3}
.of{justify-self:end;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.08);border:1.5px dashed var(--oro-suave)}
.of.listo{background:rgba(120,184,75,.3);border:1.5px solid #78B84B}
.of.abierta{background:var(--papel);color:var(--tinta);border:0;animation:destapa .4s ease both}
@keyframes destapa{from{transform:rotateY(90deg)}}
.mostrador{background:linear-gradient(#8C5A2B,#6B4220);border:2px solid #E0B04A;border-radius:20px;padding:14px 10px 10px;margin-bottom:12px;text-align:center;
  box-shadow:var(--sombra),inset 0 3px 0 rgba(255,255,255,.15)}
.lotes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.lote{position:relative;width:140px;background:var(--papel);color:var(--tinta);border-radius:16px;padding:10px 8px;box-shadow:inset 0 0 0 4px var(--t),inset 0 0 0 6px #fff,0 8px 16px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;gap:4px;animation:planta .4s cubic-bezier(.2,1.3,.45,1) both}
.lote .ilu{position:relative;width:96px;height:96px;display:block}
.lote .ilu img,.lote .ilu svg{width:100%;height:100%;object-fit:contain}
.lote .ilu.dos{position:absolute;width:70%;height:70%;right:-18px;bottom:-8px}
.lote b{font-weight:600;font-size:15px;line-height:1.15}
.lote .x2{position:absolute;top:-10px;right:-10px;background:var(--oro);color:#3A2B00;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:16px;font-weight:600}
.junto{color:#F3D27A;margin:8px 0 0}
.vale{margin:10px 0 0;color:var(--crema);font-size:15.5px}
.vale b{color:#F3D27A}
.resultado{margin:10px auto 0;font-size:17px;background:rgba(0,0,0,.3);border-radius:12px;padding:8px 12px;max-width:440px}
.resultado.mio{background:rgba(61,114,36,.6);box-shadow:0 0 0 2px #78B84B}
.oferta{background:var(--panel);border:1.5px solid var(--oro);border-radius:18px;padding:12px;margin-bottom:12px;text-align:center}
.oferta.hecha{font-size:17px;color:var(--tenue)}
.oferta.hecha b{color:#F3D27A;font-size:22px}
.monto{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:8px}
.monto b{font-size:48px;min-width:70px;line-height:1}
.rapidas{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
/* Acostado: el lote y la oferta lado a lado; la tabla de la plaza a la derecha */
@media (orientation:landscape) and (max-height:500px){
  .v-lienzo:has(.mostrador){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.05fr);
    grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hud hud tab" "mos ofe tab" "nota nota tab";gap:8px 10px;overflow:hidden}
  .v-lienzo:has(.mostrador) .hud{grid-area:hud;margin:0}
  .mostrador{grid-area:mos;margin:0;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:8px 6px 6px}
  .mostrador:not(:has(+ .oferta)){grid-column:mos-start / ofe-end}
  .lote{width:118px;padding:6px 6px}
  .lote .ilu{width:70px;height:70px}
  .lote b{font-size:13px}
  .vale,.junto,.resultado{font-size:13px;margin:6px 0 0}
  .oferta{grid-area:ofe;margin:0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .oferta .monto{margin:0}
  .oferta .boton.redondo{width:44px;height:44px;font-size:24px}
  .oferta .rapidas{margin:0;gap:4px}
  .oferta .rapidas .boton{padding:5px 10px;font-size:13px}
  .oferta .jugar{font-size:15px;padding:8px 6px;white-space:nowrap;letter-spacing:.02em}
  .tabla-g{grid-area:tab;margin:0;min-height:0;overflow:auto;padding:6px;gap:4px}
  .tabla-g>div{grid-template-columns:28px minmax(0,1fr) 34px;grid-template-areas:"av nm of" "av bod of";gap:2px 6px;padding:4px 6px}
  .tabla-g>div>:first-child{grid-area:av}
  .tabla-g .nm{grid-area:nm}
  .tabla-g .bod{grid-area:bod}
  .tabla-g .of{grid-area:of}
  .tabla-g .nm small{display:inline;margin-left:4px}
  .tabla-g .nm{font-size:13px}
  .tabla-g .nm small{font-size:10.5px}
  .gente-g svg,.gente-g img{width:28px;height:28px}
  .cul{width:20px;height:20px}
  .cul b{min-width:13px;height:13px;font-size:9.5px;right:-4px;bottom:-4px}
  .of{width:32px;height:32px;font-size:15px}
  .v-lienzo:has(.mostrador) > .nota{grid-area:nota;margin:0;font-size:11px}
  /* la plaza abierta: el código a la izquierda, la gente a la derecha */
  .plaza-sala{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:center}
  .plaza-sala > div{min-height:0;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:6px;align-items:center}
  .plaza-sala .clave{margin:4px 0}
  .plaza-sala .clave i{width:44px;height:52px;font-size:30px}
  .plaza-sala .gente-g{margin:0;width:100%;gap:4px}
  .plaza-sala .gente-g>div{padding:3px 8px}
  .plaza-sala .gente-g svg,.plaza-sala .gente-g img{width:28px;height:28px}
  .plaza-sala .fila.centro{margin:0}
  .plaza-sala .nota{margin:0}
  .plaza-fin{height:100%;display:flex;flex-direction:column;gap:6px;overflow:auto}
  .plaza-fin h2{margin:0}
  .plaza-fin .tabla-g{flex:1;min-height:0;overflow:auto}
  .plaza-fin .fila.centro{margin:0}
}
</style>
<script src="girar.js"></script>
<script src="supabase-config.js"></script>
<script src="cuenta.js"></script>
</head>
<body>
<main class="v-lienzo" id="app"></main>
<script src="config.js"></script>
<script src="reglas.js"></script>
<script src="arte.js"></script>
<script src="sonido.js"></script>
<script src="vereda/nucleo.js"></script>
<script src="vereda/galeria-reglas.js"></script>
<script src="vereda/galeria.js"></script>
</body>
</html>
