<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A3A22">
<base href="../">
<title>La Recolecta · La Vereda</title>
<link rel="stylesheet" href="vereda/vereda.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%234A6338'/%3E%3Cellipse cx='24' cy='24' rx='11' ry='15' fill='%23F4EFE2'/%3E%3Cpath d='M24 11c-3 4.5-3 21.5 0 26' fill='none' stroke='%234A6338' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
.rama{position:relative;width:100%;aspect-ratio:4/3.4;border-radius:20px;overflow:hidden;border:1.5px solid var(--oro);
  background:radial-gradient(120% 90% at 50% 30%,#5F8A45 0%,#3E6330 55%,#2A4520 100%);box-shadow:var(--sombra);
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rama>svg{position:absolute;inset:0;width:100%;height:100%}
.cereza{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);border:0;padding:0;background:none;
  animation:brota .22s cubic-bezier(.2,1.4,.4,1) forwards;touch-action:manipulation}
.cereza svg{width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.cereza.sale{animation:cae .35s ease-in forwards}
.cereza.cogida{animation:cogida .3s ease-out forwards}
@keyframes brota{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes cae{to{transform:translate(-50%,40%) scale(.7);opacity:0}}
@keyframes cogida{to{transform:translate(-50%,-120%) scale(1.3);opacity:0}}
.leyenda{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}
.leyenda div{background:rgba(0,0,0,.25);border-radius:14px;padding:10px 6px;text-align:center;font-size:14.5px;line-height:1.25}
.leyenda svg{width:54px;height:54px;margin:0 auto 4px}
.leyenda b{display:block;font-size:16px;font-weight:600;color:#F3D27A}
.dato-real{font-size:14.5px;color:var(--tenue);background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px;line-height:1.4;margin:0 0 14px}
</style>
<script src="girar.js"></script>
</head>
<body>
<main class="v-lienzo" id="app"></main>
<script src="reglas.js"></script>
<script src="arte.js"></script>
<script src="sonido.js"></script>
<script src="vereda/nucleo.js"></script>
<script src="vereda/recolecta.js"></script>
</body>
</html>
