<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A3A22">
<base href="../">
<title>El color manda · La Vereda</title>
<link rel="stylesheet" href="vereda/vereda.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%234A6338'/%3E%3Cellipse cx='24' cy='24' rx='11' ry='15' fill='%23F4EFE2'/%3E%3Cpath d='M24 11c-3 4.5-3 21.5 0 26' fill='none' stroke='%234A6338' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
.duelo{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 10px;min-height:190px}
.duelo .cartica{width:128px;pointer-events:none}
.duelo .cartica .ilu{width:96px;height:96px}
.duelo .flecha{font-size:30px;color:var(--oro)}
.duelo .mata{width:120px;pointer-events:none}
.duelo .mata .disco{width:104px;height:104px}
.duelo .mata .est{font-size:14px}
.duelo .mata .enc span{width:32px;height:32px}
.duelo .mata .tu{font-size:13px;color:var(--tenue)}
.pregunta{text-align:center;font-size:clamp(20px,5.2vw,26px);margin:4px 0 14px}
.respuestas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.resp{border-radius:22px;padding:16px 10px;font-size:clamp(22px,6vw,28px);border:2px solid #F3D27A;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 8px 18px rgba(0,0,0,.4);transition:transform .1s}
.resp:active{transform:translateY(2px)}
.resp.si{background:linear-gradient(#78B84B,#5E9B3A 45%,#3D7224)}
.resp.no{background:linear-gradient(#E26A55,#C0392B 45%,#8E2A20)}
.resp small{display:block;font-size:14px;opacity:.9;text-shadow:none}
.resp[disabled]{opacity:.5}
.explica{min-height:64px;margin-top:14px;border-radius:16px;padding:10px 14px;font-size:17px;line-height:1.35;text-align:center;
  background:rgba(0,0,0,.28);border:1.5px solid transparent;color:var(--crema)}
.explica.bien{border-color:#78B84B;background:rgba(61,114,36,.35)}
.explica.mal{border-color:#E26A55;background:rgba(142,42,32,.4)}
.explica:empty{visibility:hidden}
.reglas-mini{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.reglas-mini li{display:flex;gap:10px;align-items:center;font-size:15.5px;line-height:1.3;color:var(--crema);
  background:rgba(0,0,0,.22);border-radius:12px;padding:8px 10px}
.reglas-mini li b{color:#F3D27A;font-weight:600}
.reglas-mini .p{width:38px;height:38px;flex:none}
.reglas-mini .p img,.reglas-mini .p svg{width:100%;height:100%;object-fit:contain}
/* Acostado: la carta y la mata a la izquierda, los botones a la derecha */
@media (orientation:landscape) and (max-height:500px){
  .v-lienzo:has(#duelo){display:flex;flex-direction:column;overflow:hidden}
  .v-lienzo:has(#duelo) .marco{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"duelo resp" "preg exp";gap:6px 16px;align-items:center}
  .duelo{grid-area:duelo;min-height:0;margin:0}
  .duelo .cartica{width:112px}
  .duelo .cartica .ilu{width:78px;height:78px}
  .duelo .mata .disco{width:90px;height:90px}
  .pregunta{grid-area:preg;margin:0;font-size:19px}
  .respuestas{grid-area:resp;height:100%;align-content:center}
  .resp{padding:22px 8px;font-size:26px}
  .explica{grid-area:exp;margin:0;min-height:0;font-size:13.5px;padding:6px 10px;line-height:1.3}
}
</style>
<script src="girar.js"></script>
<script src="supabase-config.js"></script>
<script src="cuenta.js"></script>
</head>
<body>
<main class="v-lienzo" id="app"></main>
<script src="reglas.js"></script>
<script src="arte.js"></script>
<script src="sonido.js"></script>
<script src="vereda/nucleo.js"></script>
<script src="guia.js"></script>
<script src="vereda/colores.js"></script>
</body>
</html>
