<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1830">
<base href="../">
<title>Espantos en la oscuridad · La Vereda</title>
<link rel="stylesheet" href="vereda/vereda.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%234A6338'/%3E%3Cellipse cx='24' cy='24' rx='11' ry='15' fill='%23F4EFE2'/%3E%3Cpath d='M24 11c-3 4.5-3 21.5 0 26' fill='none' stroke='%234A6338' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
body[data-escena="noche"]{
  --velo:radial-gradient(120% 90% at 50% 20%,rgba(22,20,48,.78) 0%,rgba(14,14,34,.88) 55%,rgba(8,8,20,.94) 100%);
  --luz:saturate(.55) brightness(.6) hue-rotate(18deg); --tinte:rgba(90,80,200,.25); --luciernagas:1; --bruma:1.4}
.pasos{margin:8px 0 12px;padding-left:22px;color:var(--crema);font-size:15px;line-height:1.4}
.pasos li{margin-bottom:5px}
.pasos b{color:#F3D27A;font-weight:600}
.galeria-esp{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.galeria-esp span{width:50px;height:50px;border-radius:50%;background:var(--papel);display:grid;place-items:center;box-shadow:inset 0 0 0 3px #6B4FA8,0 4px 10px rgba(0,0,0,.4)}
.galeria-esp img,.galeria-esp svg{width:80%;height:80%;object-fit:contain}
.rot{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);margin:6px 0 4px}
.rio{background:linear-gradient(rgba(30,40,80,.55),rgba(14,20,44,.75));border:1.5px solid rgba(160,150,255,.35);border-radius:18px;padding:10px;margin-bottom:10px;
  box-shadow:inset 0 -18px 30px rgba(60,90,160,.25)}
.camino-rio{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scroll-behavior:smooth;min-height:128px;align-items:center}
.carta-rio{position:relative;flex:none;width:86px;border-radius:12px;background:var(--papel);color:var(--tinta);padding:6px 4px 6px;
  display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:inset 0 0 0 3px var(--t),inset 0 0 0 5px #fff,0 6px 12px rgba(0,0,0,.45)}
.carta-rio .ilu{width:60px;height:60px}
.carta-rio .ilu img,.carta-rio .ilu svg{width:100%;height:100%;object-fit:contain}
.carta-rio .v{position:absolute;top:-7px;left:-7px;width:28px;height:28px;border-radius:50%;background:var(--oro);color:#3A2B00;display:grid;place-items:center;font-size:15px;font-weight:600;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.carta-rio .n{font-size:11px;line-height:1.1;text-align:center;min-height:2.2em;display:grid;place-items:center}
.carta-rio .resto{position:absolute;bottom:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#7B4B2A;color:#fff;font-size:12.5px;display:grid;place-items:center;padding:0 5px;border:1.5px solid #F3D27A}
.carta-rio.espanto{background:#E9E4FF}
.carta-rio.nueva{animation:voltea .45s cubic-bezier(.2,1.3,.45,1)}
@keyframes voltea{from{transform:rotateY(90deg) scale(.8);opacity:.3}}
.carta-rio.alumbrada{--t:#F3D27A;border:2px dashed #F3D27A;box-shadow:0 0 22px 6px rgba(243,210,122,.5)}
.carta-rio.alumbrada small{font-size:10.5px;color:#7B4B2A}
.suelo{font-size:13.5px;color:var(--tenue);text-align:center}
.suelo b{color:#F3D27A}
.alerta{border-radius:16px;padding:8px 12px;background:rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.12);margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.alerta.si{border-color:#B79CFF;background:rgba(80,50,140,.35)}
.alerta b{font-weight:600}
.alerta small{width:100%;color:var(--tenue);font-size:13.5px}
.alerta .vistos{display:flex;gap:5px}
.alerta .vistos span{width:38px;height:38px;border-radius:50%;background:var(--papel);display:grid;place-items:center;box-shadow:inset 0 0 0 2.5px #6B4FA8}
.alerta .vistos img,.alerta .vistos svg{width:80%;height:80%;object-fit:contain}
.gente{background:var(--panel);border:1.5px solid var(--oro-suave);border-radius:16px;padding:6px 10px;margin-bottom:10px}
.persona{display:grid;grid-template-columns:40px 1fr 44px 44px;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(224,176,74,.12)}
.persona .av,.persona svg,.persona img{width:40px;height:40px}
.persona .nom{font-size:15px;line-height:1.15}
.persona .nom small{display:block;font-size:12px;color:var(--tenue)}
.persona .lleva,.persona .costal-p{text-align:center;border-radius:10px;padding:2px 0;font-size:16px}
.persona .lleva{background:rgba(243,210,122,.18);color:#F3D27A}
.persona .costal-p{background:#7B4B2A}
.persona.casa{opacity:.62}
.persona.yo .nom{color:#F3D27A}
.leyenda-p{display:grid;grid-template-columns:1fr 44px 44px;gap:8px;font-size:10.5px;color:var(--tenue);text-align:center;padding-top:4px}
.leyenda-p span:first-child{grid-column:2}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.decide #farol{grid-column:1 / 3}
.decide .jugar{font-size:clamp(18px,5vw,22px);padding:14px 10px}
.decide .vuelvo{background:linear-gradient(#C68A4A,#A0612B 45%,#6E3E16)}
.decide .espera{grid-column:1 / 3;text-align:center;color:var(--tenue)}
.tabla{display:flex;flex-direction:column;gap:5px;margin:8px 0 12px}
.tabla div{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:10px;padding:5px 10px;text-align:left}
.tabla span{flex:1;text-align:left}
.tabla svg,.tabla img{width:30px;height:30px}
@media (min-width:760px){.carta-rio{width:100px}.carta-rio .ilu{width:72px;height:72px}}
/* Acostado: el río a la izquierda; la gente y las decisiones a la derecha */
@media (orientation:landscape) and (max-height:500px){
  .v-lienzo:has(#camino){display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.42fr);
    grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hud gente" "rio gente" "alerta decide";gap:8px 12px;overflow:hidden}
  .v-lienzo:has(#camino) .hud{grid-area:hud;margin:0}
  .rio{grid-area:rio;margin:0;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:6px 8px}
  .camino-rio{min-height:0;padding:8px 2px 6px}
  .suelo{font-size:12px}
  .alerta{grid-area:alerta;margin:0;padding:5px 10px;gap:2px 8px}
  .alerta b{font-size:14px}
  .alerta small{font-size:12px}
  .alerta .vistos span{width:30px;height:30px}
  .gente{grid-area:gente;margin:0;min-height:0;overflow:auto;padding:4px 8px}
  .persona{grid-template-columns:30px 1fr 34px 34px;gap:6px;padding:2px 0}
  .persona .av,.persona svg,.persona img{width:30px;height:30px}
  .persona .nom{font-size:13.5px}
  .persona .nom small{font-size:10.5px}
  .gente:has(.persona:nth-child(4)) .persona .nom small{display:none}
  .persona .lleva,.persona .costal-p{font-size:14px}
  .leyenda-p{grid-template-columns:1fr 34px 34px;gap:6px;padding-top:1px;font-size:9.5px}
  .decide{grid-area:decide;gap:6px}
  .decide .boton{padding:6px 10px;font-size:13px}
  .decide .jugar{font-size:15px;padding:8px 4px;white-space:nowrap;letter-spacing:.02em}
  .decide .espera{grid-column:1 / 3;font-size:13px;color:var(--tenue);text-align:center}
}
</style>
<script src="girar.js"></script>
<script src="supabase-config.js"></script>
<script src="cuenta.js"></script>
</head>
<body>
<main class="v-lienzo" id="app"></main>

</body>
</html>
