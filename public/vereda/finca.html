<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A3A22">
<base href="../">
<title>Mi finca · La Vereda</title>
<link rel="stylesheet" href="vereda/vereda.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%237A5A2E'/%3E%3Cpath d='M10 28l14-12 14 12v10H10z' fill='%23F4EFE2'/%3E%3Cpath d='M7 29l17-15 17 15' fill='none' stroke='%23C2562E' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* La finca: el terreno ocupa todo lo que haya; a un lado (o arriba), el
   nivel y los tres botones: puesto, encargos y construir. */
.v-lienzo:has(.f-juego){max-width:1180px;display:flex;flex-direction:column;min-height:calc(100dvh - 64px);padding-bottom:12px}
.f-juego{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
.f-lado{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.f-nivel{flex:1 1 220px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--oro-suave);border-radius:16px;padding:6px 12px}
.f-nivel .num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#8CC152,#4E8A2A);
  border:2px solid #CDEB9A;font-weight:600;font-size:20px;color:#10200A;flex:none}
.f-nivel .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.f-nivel .xp{height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.f-nivel .xp i{display:block;height:100%;background:linear-gradient(90deg,#8CC152,#C6E77F);transition:width .6s ease}
.f-nivel small{color:var(--tenue);font-size:12.5px}
.f-acc{flex:1 1 110px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);border:1.5px solid var(--oro-suave);
  border-radius:16px;padding:8px 10px;font-size:16px;position:relative;min-height:54px}
.f-acc svg,.f-acc img{width:30px;height:30px;object-fit:contain;flex:none}
.f-acc .burbuja{position:absolute;top:-7px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--rojo);color:#fff;
  font-size:13px;display:grid;place-items:center;padding:0 6px;border:2px solid #FFD9D2}
.f-acc .burbuja.ok{background:#4E8A2A;border-color:#CDEB9A}
.f-campo{position:relative;min-height:240px;border-radius:22px;overflow:hidden;border:1.5px solid var(--oro-suave);
  background:#5A9537;box-shadow:var(--sombra);touch-action:none;cursor:grab}
.f-mundo{position:absolute;left:0;top:0;width:1736px;height:1128px;transform-origin:0 0;user-select:none;-webkit-user-select:none}
.f-mundo>svg.tierra{position:absolute;inset:0;width:1736px;height:1128px}
.f-obj{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;display:flex;flex-direction:column;align-items:center}
.f-obj img,.f-obj svg{display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.28))}
.f-obj.toca{pointer-events:auto;background:none;border:0;padding:0;cursor:pointer}
.f-lote{position:absolute;width:160px;height:80px;transform:translate(-50%,-50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  background:transparent;border:0;padding:0;cursor:pointer}
.f-lote:focus-visible{outline:none;background:rgba(255,236,170,.35)}
.f-lote.marca{background:rgba(255,236,170,.28)}
.f-mata{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;display:flex;flex-direction:column;align-items:center}
.f-mata .dib{display:flex;align-items:flex-end;justify-content:center}
.f-mata .dib>*{filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.f-mata.seca .dib{filter:grayscale(.85) sepia(.5) brightness(.8)}
.f-mata.plagada .dib{filter:saturate(.45) brightness(.9)}
.f-mata .f-reloj{margin-bottom:2px;position:relative;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.35);background:rgba(10,18,8,.75);color:var(--crema);font-size:12px;border-radius:8px;padding:0 6px;font-variant-numeric:tabular-nums}
.f-mata .f-reloj.peligro{background:#8E2A20;color:#FFE1DA}
.f-insignia{position:absolute;top:-4px;right:-10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  animation:flota 1.2s ease-in-out infinite alternate}
.f-insignia.lista{background:#FFD45A;border:2px solid #7A5310;color:#3A2A08;font-size:16px;font-weight:600}
.f-insignia.plaga{background:#FFF1EC;border:3px solid var(--rojo)}
.f-insignia.plaga img,.f-insignia.plaga svg{width:21px;height:21px;object-fit:contain}
.f-insignia.huevo{background:#FFF8E6;border:2px solid var(--oro);font-size:16px}
@keyframes flota{to{transform:translateY(-6px)}}
.f-hoja{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:82dvh;overflow:auto;background:var(--panel-2);border-top:2px solid var(--oro);
  border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -14px 34px rgba(0,0,0,.45);animation:subeHoja .25s ease}
@keyframes subeHoja{from{transform:translateY(100%)}}
.f-hoja h3{margin:0 0 4px;font-size:21px;font-weight:600;color:var(--oro);text-align:center}
.f-hoja>p{margin:0 0 10px;text-align:center;color:var(--tenue);font-size:15px}
.f-velo{position:fixed;inset:0;z-index:49;background:rgba(8,14,6,.5)}
.f-opciones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.f-op{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(0,0,0,.25);border:1.5px solid var(--oro-suave);border-radius:16px;padding:8px 10px;font-size:15px}
.f-op .ilu{width:54px;height:54px;flex:none;display:grid;place-items:center}
.f-op .ilu img,.f-op .ilu svg{width:54px;height:54px;object-fit:contain}
.f-op b{display:block;font-size:17px;font-weight:600}
.f-op small{display:block;color:var(--tenue);font-size:13px;line-height:1.3}
.f-op[disabled]{opacity:.45}
.f-op .precio{display:inline-flex;align-items:center;gap:3px;color:#F3D27A}
.f-op .precio svg{width:16px;height:16px}
.f-encargo{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;background:rgba(0,0,0,.25);border:1.5px solid var(--oro-suave);border-radius:16px;padding:10px}
.f-encargo .ilu{grid-row:span 3;width:64px;height:64px}
.f-encargo .ilu img,.f-encargo .ilu svg{width:64px;height:64px;object-fit:contain}
.f-encargo b{font-size:17px}
.f-encargo .req{display:flex;gap:6px;flex-wrap:wrap}
.f-encargo .req span{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.3);border-radius:10px;padding:2px 7px 2px 3px;font-size:14px}
.f-encargo .req span.falta{color:#FFB4A8}
.f-encargo .req img,.f-encargo .req svg{width:24px;height:24px;object-fit:contain}
.f-encargo .bts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f-encargos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.f-cerrar{display:block;margin:12px auto 0}
.f-flota{position:fixed;z-index:70;pointer-events:none;font-size:24px;font-weight:600;color:#FFE38A;
  text-shadow:0 2px 0 #6B4A10,0 0 10px rgba(0,0,0,.5);animation:flotaArriba 1.3s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes flotaArriba{from{opacity:0;margin-top:10px}20%{opacity:1}to{opacity:0;margin-top:-60px}}
@media (min-width:900px){ .f-hoja{left:50%;right:auto;width:min(720px,94vw);transform:translateX(-50%);border-radius:22px 22px 0 0;border:2px solid var(--oro);border-bottom:0}
  @keyframes subeHoja{from{transform:translate(-50%,100%)}} }
/* Teléfono acostado: el terreno a la izquierda y la columna de botones a la derecha */
@media (orientation:landscape) and (max-height:500px){
  .v-lienzo:has(.f-juego){min-height:0;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .f-juego{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) 170px;gap:8px}
  .f-campo{grid-column:1;grid-row:1;min-height:0}
  .f-lado{grid-column:2;grid-row:1;flex-direction:column;flex-wrap:nowrap}
  .f-nivel{flex:none;padding:4px 8px;gap:6px}
  .f-nivel .num{width:34px;height:34px;font-size:17px}
  .f-nivel .txt{font-size:12.5px}
  .f-acc{flex:1;min-height:0;font-size:14.5px;padding:4px 8px;justify-content:flex-start}
  .f-acc svg,.f-acc img{width:26px;height:26px}
  .f-hoja{left:50%;right:auto;width:min(660px,96vw);transform:translateX(-50%);max-height:92dvh;padding:10px 14px}
  @keyframes subeHoja{from{transform:translate(-50%,100%)}}
  .f-hoja h3{font-size:18px}
  .f-hoja>p{font-size:13.5px;margin-bottom:6px}
  .f-op{padding:5px 8px}
  .f-op .ilu,.f-op .ilu img,.f-op .ilu svg{width:42px;height:42px}
}
</style>
<script src="girar.js"></script>
<script src="supabase-config.js"></script>
<script src="cuenta.js"></script>
</head>
<body>
<main class="v-lienzo" id="app"></main>
<script src="reglas.js"></script>
<script src="arte.js"></script>
<script src="sonido.js"></script>
<script src="vereda/nucleo.js"></script>
<script src="guia.js"></script>
<script src="vereda/finca-reglas.js"></script>
<script src="vereda/finca.js"></script>
</body>
</html>
