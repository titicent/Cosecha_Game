<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A3A22">
<title>Cosecha</title>
<style>
:root{
  --fieltro:#33452A; --fieltro-luz:#4A6338; --borde:#1C2916;
  --enamel:#FBF8F1; --tinta:#1F2415; --tenue:#757A63;
  --madera:#7A5334; --madera-luz:#96693F; --madera-oscura:#54371F;
  --ambar:#E8A62C; --peligro:#C0392B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--enamel);-webkit-text-size-adjust:100%;overscroll-behavior-y:none;
  background:var(--borde);
  background-attachment:fixed;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
svg{display:block;width:100%;height:100%}

/* ── cabecera ── */
.barra{display:flex;align-items:center;gap:7px;padding:calc(9px + env(safe-area-inset-top)) 13px 9px;
  background:rgba(9,32,27,.55);backdrop-filter:blur(6px);position:sticky;top:0;z-index:30}
.marca{font-size:13.5px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca i{font-style:normal;color:var(--ambar)}
.chip{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);padding:4px 8px;
  border-radius:20px;letter-spacing:1.2px;flex:none;white-space:nowrap}
.chip.mazo{letter-spacing:0;font-weight:600}
.chip:empty{display:none}
.son{border:0;background:rgba(255,255,255,.14);border-radius:20px;padding:6px;color:#EAF3F0;
  width:28px;height:28px;flex:none}
.son svg{width:16px;height:16px;margin:0 auto}
.son[aria-pressed=false]{opacity:.4}
.lienzo{max-width:780px;margin:0 auto;padding:12px 12px 0}
.lienzo:has(.tablero){max-width:none;padding:0}
body:has(.tablero) .barra{position:fixed;top:0;left:0;right:0;background:transparent;padding:6px 10px;
  pointer-events:none;z-index:30}
body:has(.tablero) .barra .marca{display:none}
body:has(.tablero) .barra .chip{display:none}
body:has(.tablero) .barra{width:auto;right:auto;gap:5px}
body:has(.tablero) .barra > *{pointer-events:auto}
body:has(.tablero) .barra .son,body:has(.tablero) .barra .chip{background:rgba(9,32,27,.6)}
.pie{height:calc(200px + env(safe-area-inset-bottom))}

/* ── paneles claros ── */
.panel{background:var(--enamel);color:var(--tinta);border-radius:14px;padding:15px;margin-bottom:12px;
  box-shadow:0 10px 24px rgba(0,0,0,.22)}
.panel h2{margin:0 0 3px;font-size:17px;font-weight:750;letter-spacing:-.3px}
.panel p{margin:0 0 12px;font-size:13px;line-height:1.55;color:var(--tenue)}
.panel p.junto{margin-bottom:0}
.campo{border:1.5px solid #D3DCD9;border-radius:10px;padding:12px;font-size:16px;width:100%;
  background:#fff;font-family:inherit;color:var(--tinta)}
.campo.codigo{text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:800;font-size:24px}
.btn{border:0;border-radius:10px;background:#4A6338;color:#fff;padding:12px 16px;font-size:14px;font-weight:700}
.btn.ancho{width:100%;padding:15px}
.btn.claro{background:#E4EBE8;color:#24322F}
.btn.oro{background:var(--ambar);color:#3A2B00}
.btn[disabled]{opacity:.4}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:#33443F;margin-bottom:11px}
.opt input{margin-top:2px;width:18px;height:18px;flex:none}
.rot{font-size:12px;font-weight:700;color:#4A5A56;margin:0 0 6px}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.seg button{border:1.5px solid #D3DCD9;background:#fff;color:#33443F;border-radius:8px;
  padding:8px 11px;font-size:12.5px;font-weight:650}
.seg button[aria-pressed=true]{background:#4A6338;border-color:#4A6338;color:#fff}
.seg button[disabled]{opacity:.5}

/* ── sillas ── */
.mesa{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.silla{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:13px;
  padding:9px 10px;display:flex;gap:10px;align-items:flex-start;transition:box-shadow .25s,background .25s}
.silla.activa{background:rgba(242,183,5,.14);border-color:rgba(242,183,5,.5);
  box-shadow:0 0 0 1px rgba(242,183,5,.35), 0 6px 18px rgba(0,0,0,.25)}
.silla.mia{background:rgba(255,255,255,.12)}
.av{border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 5px rgba(0,0,0,.25)}
.avwrap{position:relative;flex:none;width:44px;height:44px}
.avwrap .nsanos{position:absolute;right:-5px;bottom:-5px;background:var(--enamel);color:var(--tinta);
  font-size:10.5px;font-weight:800;border-radius:9px;padding:1px 5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.avwrap .nsanos.cerca{background:var(--peligro);color:#fff}
.datos{flex:1;min-width:0}
.linea{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.quien{font-size:13.5px;font-weight:750}
.mini{font-size:10.5px;font-weight:650;opacity:.72}
.mini.off{color:#F0B9AE;opacity:1}
.botsel{position:absolute;right:-4px;top:-4px;font-size:13px;background:var(--enamel);
  border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.retirado{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.12);color:#C3D2CE;
  padding:2px 7px;border-radius:20px}
.silla.ido{opacity:.5}
.finsin{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);color:#EAF3F0;
  border-radius:14px;padding:18px;text-align:center;margin-bottom:12px}
.finsin b{font-size:19px;display:block;margin-bottom:4px}
.finsin span{font-size:13px;opacity:.8}
.maldito{font-size:10.5px;font-weight:700;background:rgba(224,122,31,.25);color:#FFD3A6;
  padding:2px 7px;border-radius:20px;border:1px solid rgba(224,122,31,.5)}
.reloj{height:4px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:7px}
.reloj i{display:block;height:100%;background:var(--ambar);width:100%}
.reloj i.poco{background:var(--peligro)}
.filas{display:flex;flex-wrap:wrap;gap:6px}
.vacio{font-size:11.5px;opacity:.5;padding:3px 0}

/* ── fichas de mata ── */
.ficha{width:54px;border-radius:9px;background:var(--enamel);padding:4px 3px 2px;border:0;display:block;
  box-shadow:0 2px 0 rgba(0,0,0,.28), 0 3px 7px rgba(0,0,0,.22);position:relative}
.ficha .cara{width:100%;aspect-ratio:1}
.ficha .pie2{font-size:8.5px;font-weight:700;text-align:center;color:var(--tinta);opacity:.6;line-height:1.15;padding-bottom:2px}
.ficha.enferma{background:#E7DCD7}
.ficha .sello{position:absolute;right:-4px;top:-5px;width:21px;height:21px;border-radius:50%;
  background:var(--enamel);box-shadow:0 1px 3px rgba(0,0,0,.35);padding:2px}
.ficha .escudo{position:absolute;left:-4px;top:-5px;width:19px;height:19px;border-radius:50%;
  background:#2E5C56;box-shadow:0 1px 3px rgba(0,0,0,.35);color:#fff;padding:3px}
.ficha.blanco::after{content:"";position:absolute;inset:-4px;border-radius:12px;
  border:2.5px solid var(--ambar);animation:latir 1.3s ease-in-out infinite}
@keyframes latir{0%,100%{box-shadow:0 0 0 0 rgba(242,183,5,.5)}50%{box-shadow:0 0 0 6px rgba(242,183,5,0)}}
@media (prefers-reduced-motion:reduce){.ficha.blanco::after{animation:none}}

/* ── atril ── */
.atril{position:fixed;left:0;right:0;bottom:0;z-index:25;
  padding:0 10px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(6,24,20,0), rgba(6,24,20,.6) 40%)}
.tabla{max-width:780px;margin:0 auto;
  background:linear-gradient(var(--madera-luz), var(--madera) 42%, var(--madera-oscura));
  border-radius:13px 13px 9px 9px;padding:9px 9px 11px;
  box-shadow:0 -2px 0 rgba(255,255,255,.15) inset, 0 10px 26px rgba(0,0,0,.42)}
.aviso{font-size:12px;color:#F7EEE2;padding:1px 3px 8px;display:flex;justify-content:space-between;
  align-items:center;gap:9px}
.aviso b{font-size:13.5px;font-weight:750}
.aviso .seg2{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
.aviso .seg2.poco{color:#FFD9CF}
.cartas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.carta{background:transparent;border:0;padding:0;display:block;min-width:0;
  transition:transform .16s ease, filter .16s ease;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.3)) drop-shadow(0 5px 11px rgba(0,0,0,.34))}
.carta.elegida{transform:translateY(-12px);
  filter:drop-shadow(0 9px 0 rgba(0,0,0,.26)) drop-shadow(0 15px 22px rgba(0,0,0,.42))}
.carta.inerte{opacity:.55}
/* cara: marco de color doble, cabecera, rótulos laterales, ilustración y esquina */
.cara{display:block;background:var(--enamel);border:2.5px solid var(--tono);border-radius:9px;
  overflow:hidden;position:relative;text-align:center;min-width:0;
  box-shadow:inset 0 0 0 1.5px #fff, inset 0 0 0 2.5px color-mix(in srgb, var(--tono) 35%, transparent)}
.cara .papel{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.014) 0 1px, transparent 1px 4px)}
.cara .cinta{display:flex;align-items:center;gap:4px;padding:4px 6px 3px 5px;min-width:0;position:relative}
.cara .ins{width:14px;height:14px;flex:none;border-radius:50%;background:var(--tono);padding:2px}
.cara .tit{font-size:7.4px;font-weight:800;color:var(--tono);letter-spacing:.25px;line-height:1.45;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.cara .tit b{font-weight:600;opacity:.8}
.cara .ilustra{position:relative;padding:2px 14px 0}
.cara .obra{position:relative;display:block;aspect-ratio:1}
.cara .obra img{width:100%;height:100%;object-fit:contain;display:block}
.cara .alpie{display:block;font-size:6.4px;font-weight:800;color:var(--tono);letter-spacing:.3px;line-height:1.5;
  padding:1px 18px 5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;text-align:left;position:relative}
.cara .lado{position:absolute;top:24px;bottom:16px;width:12px;writing-mode:vertical-rl;
  font-size:5.8px;font-weight:800;color:var(--tono);letter-spacing:.5px;opacity:.8;
  display:flex;align-items:center;justify-content:flex-start;overflow:hidden;line-height:12px}
.cara .lado.izq{left:1px;transform:rotate(180deg);justify-content:flex-end}
.cara .lado.der{right:1px}
.cara .esq{position:absolute;right:4px;bottom:4px;width:14px;height:14px;border-radius:50%;
  padding:2.5px;background:var(--sello, var(--tono))}
.cara .esq.base{--sello:#4A6338}
.cara .esq.bonanza{--sello:#B8891B}
.cara .esq.espantos{--sello:#6B4FA8}
.cara.gr .tit{font-size:10px}.cara.gr .alpie{font-size:8.5px}.cara.gr .lado{font-size:7.5px;width:15px;line-height:15px}
.cara.gr .ins{width:18px;height:18px}.cara.gr .esq{width:19px;height:19px;padding:3.5px}
.cara.gr .ilustra{padding:4px 19px 0}.cara.gr .lado{font-size:7px}
.fichagrande{width:96px;margin:0 auto 12px;background:var(--enamel);border-radius:14px;padding:10px}
.grandota{width:150px;margin:0 auto 14px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.3))}

.bandeja{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;max-height:33vh;overflow:auto}
.acc{background:var(--enamel);color:var(--tinta);border:0;border-radius:9px;padding:11px 12px;
  font-size:13px;font-weight:650;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.acc.tenue{background:rgba(255,255,255,.17);color:#F7EEE2;box-shadow:none;font-weight:600}

/* ── varios ── */
.diario{background:rgba(0,0,0,.2);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.6;
  color:#D7E4E0;margin-bottom:12px}
.diario div{padding:2px 0;border-top:1px solid rgba(255,255,255,.07)}
.diario div:first-child{border-top:0;color:#fff;font-weight:600}
.diario .conteo{color:#9FB6B0;font-size:11px;font-weight:600;padding-bottom:5px}
.diario .conteo + div{border-top:1px solid rgba(255,255,255,.07);color:#fff}
.sug{background:rgba(242,183,5,.16);border:1px solid rgba(242,183,5,.35);border-radius:10px;
  padding:9px 11px;font-size:12.5px;line-height:1.5;color:#FBEFD0;margin-bottom:8px}
.telon{position:fixed;inset:0;background:rgba(6,22,19,.72);display:flex;align-items:center;
  justify-content:center;z-index:60;padding:16px}
.dialogo{background:var(--enamel);color:var(--tinta);border-radius:15px;padding:19px;width:100%;
  max-width:400px;max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.dialogo h3{margin:0 0 5px;font-size:18px;font-weight:800}
.dialogo p{margin:0 0 14px;font-size:13px;line-height:1.55;color:#4A5A56}
.cuenta{font-size:34px;font-weight:800;color:var(--peligro);text-align:center;margin:4px 0 14px;
  font-variant-numeric:tabular-nums}
.trofeo{background:linear-gradient(#F2B705,#D99A04);color:#3A2B00;border-radius:14px;padding:18px;
  text-align:center;margin-bottom:12px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.trofeo b{font-size:21px;display:block;margin-bottom:3px}
.alerta{position:fixed;left:12px;right:12px;bottom:calc(210px + env(safe-area-inset-bottom));
  background:#7A2E2E;color:#fff;padding:11px 14px;border-radius:10px;font-size:13px;z-index:70;
  text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.35)}
/* la carta jugada aparece en el centro y viaja hasta donde cae */
.vuelo{position:fixed;left:50%;top:38%;z-index:55;width:82px;pointer-events:none;
  transform:translate(-50%,-50%);opacity:1;
  transition:transform .62s cubic-bezier(.4,0,.2,1), opacity .5s ease .14s;
  animation:aterriza .3s cubic-bezier(.2,1.3,.5,1)}
.vuelo .vcara{filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
.vuelo .vtexto{margin-top:7px;text-align:center;font-size:11.5px;font-weight:750;color:#fff;position:relative;z-index:2;
  text-shadow:0 2px 7px rgba(0,0,0,.75);max-width:230px;margin-left:auto;margin-right:auto;line-height:1.3}
.vuelo.ido{opacity:0;transform:translate(-50%,-50%) scale(.85)}
@keyframes aterriza{from{transform:translate(-50%,-50%) scale(.45);opacity:0}}
@media (prefers-reduced-motion:reduce){.vuelo{animation:none;transition:opacity .3s}}

/* vitrina animada de la portada */
.vitrina{display:flex;gap:9px;justify-content:center;padding:6px 4px 14px;perspective:800px}
.vcarta{width:74px;position:relative;animation:flota 3.4s ease-in-out infinite;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.vcarta .vetiq{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;font-weight:750;color:#DDEBE7;opacity:.9}
@keyframes flota{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.vcarta{animation:none}}

/* ═══════ MESA CIRCULAR ESTILO UNO (durante la partida) ═══════ */
.tablero{position:relative;width:100%;overflow:hidden;
  height:calc(100dvh - 44px - var(--mio, 160px));min-height:180px}
@supports not (height: 100dvh){.tablero{height:calc(100vh - 44px - var(--mio, 160px))}}
.centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
.pila{display:flex;flex-direction:column;align-items:center;gap:6px}
.monton{width:96px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.monton .cara{transform:rotate(-4deg)}
.vaciopila{width:96px;aspect-ratio:.72;border-radius:11px;border:2.5px dashed rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-weight:800;
  letter-spacing:1px;font-size:15px}
.conteo2{font-size:11px;font-weight:700;color:#B7C9C4;background:rgba(0,0,0,.3);padding:3px 10px;border-radius:20px}
.diariomini{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);z-index:9;
  font-size:11.5px;color:#DDEBE7;background:rgba(0,0,0,.32);padding:5px 12px;border-radius:20px;
  max-width:74%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* rivales en los bordes */
.rival{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px;border-radius:12px;transition:background .25s}
.rival.activo{background:rgba(242,183,5,.16);box-shadow:0 0 0 1px rgba(242,183,5,.4)}
.rival.ido{opacity:.5}
.rival.top{top:4px;left:50%;transform:translateX(-50%);flex-direction:row;align-items:flex-start;gap:8px}
.rival.topL{top:4px;left:26%}.rival.topR{top:4px;right:26%;left:auto}
.rival.left{left:4px;top:34px;max-width:168px}
.rival.right{right:4px;left:auto;top:34px;max-width:168px}
.rcab{display:flex;align-items:center;gap:6px;background:rgba(9,32,27,.65);border-radius:20px;padding:3px 9px 3px 3px}
.ravwrap{position:relative;width:38px;height:38px;flex:none}
.rmeta{position:absolute;right:-4px;bottom:-4px;background:var(--enamel);color:var(--tinta);font-size:9.5px;
  font-weight:800;border-radius:8px;padding:0 4px;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.rmeta.cerca{background:var(--peligro);color:#fff}
.rinfo{display:flex;flex-direction:column;min-width:0}
.rnom{font-size:12px;font-weight:750;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.rmini{font-size:9.5px;opacity:.7;white-space:nowrap}
.abanico{position:relative;height:34px;display:flex;justify-content:center;margin:1px 0}
.rival.top{align-items:flex-start}
.rival.top .rfinca{max-width:130px}
.abanico.vert{height:30px}
.reverso{position:absolute;width:20px;height:29px;border-radius:4px;
  background:linear-gradient(150deg,#7a1f1f,#4a1414);border:1.5px solid #E8C34D;
  transform-origin:center bottom;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.reverso::after{content:"";position:absolute;inset:3px;border-radius:2px;
  background:radial-gradient(circle,#C9202A 40%,#7a1515)}
.rfinca{display:grid;grid-template-columns:repeat(2,auto);gap:4px;justify-content:center;margin-top:3px;
  max-height:38dvh;overflow:auto}

/* fichas de mata en la mesa */
.ficha{border:0;background:var(--enamel);border-radius:8px;padding:3px;position:relative;display:block;
  box-shadow:0 2px 0 rgba(0,0,0,.28), 0 3px 6px rgba(0,0,0,.25)}
.ficha .cara{display:block}
.ficha.mini{width:50px}.ficha:not(.mini){width:60px}
.ficha.enferma{background:#E4D9D3}
.ficha .sello{position:absolute;right:-4px;top:-5px;width:19px;height:19px;border-radius:50%;
  background:var(--enamel);padding:1px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.ficha .escudo{position:absolute;left:-4px;top:-5px;width:17px;height:17px;border-radius:50%;
  background:#3F6B4A;padding:2px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.ficha .escudo.vac{background:#7FA35A}

.ficha .blindado{position:absolute;inset:-3px;border-radius:11px;border:2.5px solid #6FD3B4;
  box-shadow:0 0 8px rgba(111,211,180,.6)}
.ficha.blanco::after{content:"";position:absolute;inset:-4px;border-radius:11px;
  border:2.5px solid var(--ambar);animation:latir 1.3s ease-in-out infinite}

.cierre{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:8;text-align:center;
  display:flex;flex-direction:column;gap:11px;align-items:center;
  background:rgba(6,22,19,.86);padding:22px 26px;border-radius:16px;backdrop-filter:blur(3px)}
.cierre .trofeo,.cierre .finsin{margin:0}

/* ── tu zona: panel arriba, mano a la izquierda, finca a la derecha ── */
.zonami{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:0 8px calc(4px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.zonami > *{pointer-events:auto}
.fajita{font-size:12.5px;font-weight:700;color:#EAF3F0;background:rgba(9,32,27,.78);
  padding:5px 14px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.fajita.esp{opacity:.85;font-weight:600}
.fajita #segTurno{font-variant-numeric:tabular-nums;font-weight:800}
.sugmini{font-size:11.5px;color:#FBEFD0;background:rgba(242,183,5,.22);padding:4px 12px;border-radius:20px;
  max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.acciones{display:flex;flex-direction:column;gap:5px;max-height:34vh;overflow:auto;width:min(94vw,440px);
  background:rgba(9,32,27,.72);padding:7px;border-radius:12px;position:relative;z-index:8;
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.acc{background:var(--enamel);color:var(--tinta);border:0;border-radius:9px;padding:10px 12px;font-size:13px;
  font-weight:650;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.acc.tenue{background:rgba(255,255,255,.16);color:#EAF3F0;box-shadow:none;font-weight:600}

.filami{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;width:100%;max-width:780px}
.ladomano{flex:1;min-width:0;display:flex;justify-content:flex-start}
.ladofinca{flex:none;display:flex;justify-content:flex-end}
.mifinca{display:grid;grid-template-columns:repeat(2,auto);gap:4px;justify-content:end;align-content:end;
  position:relative;padding-top:14px}
.mimeta{position:absolute;top:-2px;right:0;font-size:11px;font-weight:800;background:var(--enamel);color:var(--tinta);
  border-radius:8px;padding:1px 7px;box-shadow:0 1px 2px rgba(0,0,0,.3);z-index:2}
.mimeta.cerca{background:var(--peligro);color:#fff}
.sinmata{grid-column:span 2;font-size:11px;opacity:.6;text-align:center;line-height:1.3;align-self:center}
.mano{display:flex;justify-content:flex-start;align-items:flex-end;height:100px}
.naipe{width:74px;border:0;background:transparent;padding:0;position:relative;margin:0 -11px;
  transform-origin:center bottom;transition:transform .16s ease, filter .16s ease;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
.naipe:first-child{margin-left:0}
.naipe.alza{z-index:3;transform:translateY(-10px) scale(1.05) !important;filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.naipe.gris{opacity:.5}
.naipe .ayuda{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;
  background:rgba(9,32,27,.72);color:#fff;font-size:11px;font-weight:800;line-height:16px;text-align:center}

@media (min-width:620px){.naipe{width:88px;margin:0 -6px}.monton,.vaciopila{width:112px}}
@media (max-height:520px){
  .mano{height:76px}.naipe{width:58px;margin:0 -14px}
  .ficha.mini{width:38px}.ficha:not(.mini){width:46px}
  .monton{width:66px}.vaciopila{width:66px;font-size:12px}
  .acciones{max-height:26dvh}
  .abanico{display:none}                 /* la cuenta de cartas ya va en texto */
  .ravwrap{width:30px;height:30px}.ravwrap svg{width:30px;height:30px}
  .rcab{padding:2px 7px 2px 2px}.rnom{font-size:11px;max-width:74px}.rmini{font-size:9px}
  .rmeta{font-size:8.5px}
  .rival.topL{left:20%}.rival.topR{right:20%}
  .rfinca{max-height:30dvh}
  .conteo2{font-size:9.5px;padding:2px 8px}
  .diariomini{font-size:10.5px;padding:3px 9px}
}
@media (max-height:400px){
  .rival.top{top:24px}.mano{height:68px}.naipe{width:52px}
  .ficha.mini{width:34px}.ficha:not(.mini){width:42px}
  .monton{width:56px}.vaciopila{width:56px}
}

/* jornales, clima y cosecha */
.jorn{letter-spacing:1px}
.climachip{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:9;
  font-size:11px;font-weight:700;color:#FBEFD0;background:rgba(0,0,0,.34);
  padding:3px 11px;border-radius:20px;white-space:nowrap}
.tormenta{position:fixed;inset:0;z-index:58;display:flex;align-items:center;justify-content:center;
  pointer-events:none;background:rgba(20,34,14,.5);backdrop-filter:blur(2px);
  transition:opacity .45s ease;animation:entracielo .35s ease}
.tormenta.ido{opacity:0}
.tcaja{background:linear-gradient(#E8A62C,#C9821A);color:#2A1F04;border-radius:14px;
  padding:16px 22px;text-align:center;max-width:82vw;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.tcaja b{display:block;font-size:20px;font-weight:800;margin-bottom:4px}
.tcaja span{font-size:13px;line-height:1.5}
@keyframes entracielo{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.tormenta{animation:none}}
.cara .costo{flex:none;font-size:8px;font-weight:800;color:#fff;background:rgba(0,0,0,.42);
  border-radius:20px;padding:1px 5px;line-height:1.5}
.cara.gr .costo{font-size:10px;padding:2px 7px}

/* ═══════ PAISAJE DE FONDO ═══════
   Un cafetal al amanecer detrás de todo. El velo central lo apaga justo donde
   se juega, para que las cartas y las fichas se lean sin pelear con el dibujo. */
#paisaje{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
#paisaje svg{width:100%;height:100%;display:block}
#paisaje .velo{position:absolute;inset:0;
  background:linear-gradient(rgba(20,30,16,.32) 0%, rgba(20,30,16,.20) 34%,
    rgba(20,30,16,.34) 62%, rgba(18,28,14,.58) 100%)}
#paisaje .neblina{position:absolute;left:-40%;width:180%;height:120px;
  background:linear-gradient(90deg, transparent, rgba(226,238,228,.24), transparent);
  filter:blur(14px)}
#paisaje .n1{top:34%;animation:deriva 78s linear infinite}
#paisaje .n2{top:46%;height:90px;opacity:.6;animation:deriva 116s linear infinite reverse}
@keyframes deriva{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
@media (prefers-reduced-motion:reduce){#paisaje .neblina{animation:none}}
/* durante la partida el paisaje se retira todavía más */
body:has(.tablero) #paisaje .velo{
  background:radial-gradient(122% 80% at 50% 44%, rgba(24,36,18,.90) 0%, rgba(24,36,18,.82) 40%,
    rgba(24,36,18,.66) 70%, rgba(18,28,14,.80) 100%)}
body:has(.tablero) #paisaje svg{filter:saturate(.72) brightness(.9)}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
</style>
</head>
