# Plano de despliegue para Render: con este archivo en el repo,
# "New → Blueprint" lo configura todo sin tocar ningún formulario.
#
# Son dos servicios gratuitos:
#   cosecha         el servidor del juego (también sirve la página, como antes)
#   cosecha-pagina  la misma página publicada como sitio estático: abre al
#                   instante, nunca se duerme y, si el servidor está dormido,
#                   muestra «Despertando la finca» mientras arranca.
# Comparte con tus amigos la dirección de cosecha-pagina.
services:
  - type: web
    name: cosecha
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /salud

  - type: web
    name: cosecha-pagina
    runtime: static
    buildCommand: node configurar-frente.js
    staticPublishPath: public
    envVars:
      - key: COSECHA_SERVIDOR
        fromService:
          type: web
          name: cosecha
          property: host
